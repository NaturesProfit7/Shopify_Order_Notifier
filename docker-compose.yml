services:
  db:
    image: postgres:16
    container_name: shopify_orders_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-shopify_orders}
    # ТОЛЬКО 127.0.0.1! Docker пробрасывает порты в обход ufw — с "5432:5432"
    # база доступна из интернета. Через это сервер взломали 08.05.2026:
    # брутфорс пароля → майнер в PGDATA (см. docs/server.md)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-user}", "-d", "${POSTGRES_DB:-shopify_orders}"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:

# MTU 1228 вместо дефолтных 1500: с большим MTU бот не мог отправлять файлы
# (PDF/VCF молча не уходили, кнопки при этом работали) — крупные пакеты
# резались на сетевом пути провайдера. Правка жила только на сервере,
# незакоммиченной, и терялась при каждом checkout.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1228"
